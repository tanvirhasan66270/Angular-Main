<div class="container mt-4">
  <h2 class="mb-3 text-primary">Purchase Order Management</h2>

  <!-- FORM -->
  <div class="card shadow-sm p-3 mb-4">
    <form (ngSubmit)="isEditMode ? update() : add()">
      <div class="row g-3">
        <div class="col-md-3">
          <label>PO Number</label>
          <input class="form-control" [(ngModel)]="order.poNumber" name="poNumber" />
        </div>

        <div class="col-md-3">
          <label>Supplier</label>
          <select class="form-select" [(ngModel)]="order.supplierId" name="supplierId">
            <option value="">Select Supplier</option>
            <option *ngFor="let s of suppliers" [value]="s.supplierId">
              {{ s.name }}
            </option>
          </select>
        </div>

        <div class="col-md-3">
          <label>Purchase Requisition</label>
          <select
            class="form-select"
            [(ngModel)]="order.PurchaseRequisitionId"
            name="PurchaseRequisitionId"
          >
            <option value="">Select PR</option>
            <option *ngFor="let pr of requisitions" [value]="pr.id">
              {{ pr.id }}
            </option>
          </select>
        </div>

        <div class="col-md-3">
          <label>Issued By</label>
          <input class="form-control" [(ngModel)]="order.issuedBy" name="issuedBy" />
        </div>

        <div class="col-md-3">
          <label>Total Amount</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="order.totalAmount"
            name="totalAmount"
          />
        </div>

        <div class="col-md-3">
          <label>Currency</label>
          <input class="form-control" [(ngModel)]="order.currency" name="currency" />
        </div>

        <div class="col-md-3">
          <label>Expected Delivery</label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="order.expectedDeliveryDate"
            name="expectedDeliveryDate"
          />
        </div>

        <div class="col-md-3">
          <label>Status</label>
          <select class="form-select" [(ngModel)]="order.status" name="status">
            <option value="PENDING">PENDING</option>
            <option value="APPROVED">APPROVED</option>
            <option value="REJECTED">REJECTED</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <button class="btn btn-primary">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>

        <button type="button" class="btn btn-secondary ms-2" (click)="reset()">Reset</button>
      </div>
    </form>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">Purchase Order List</div>

    <div class="card-body p-0">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>PO</th>
            <th>Supplier</th>
            <th>PR</th>
            <th>Issued By</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of orders">
            <td>{{ item.poNumber }}</td>
            <td>{{ getSupplierName(item.supplierId) }}</td>
            <td>{{ item.PurchaseRequisitionId }}</td>
            <td>{{ item.issuedBy }}</td>
            <td>{{ item.totalAmount }}</td>

            <td>
              <span
                class="badge"
                [ngClass]="{
                  'bg-warning': item.status === 'PENDING',
                  'bg-success': item.status === 'APPROVED',
                  'bg-danger': item.status === 'REJECTED',
                }"
              >
                {{ item.status }}
              </span>
            </td>

            <td>
              <button class="btn btn-sm btn-warning me-1" (click)="edit(item)">Edit</button>
              <button class="btn btn-sm btn-success me-1" (click)="approve(item)">Approve</button>
              <button class="btn btn-sm btn-danger me-1" (click)="reject(item)">Reject</button>
              <button class="btn btn-sm btn-dark" (click)="delete(item.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
