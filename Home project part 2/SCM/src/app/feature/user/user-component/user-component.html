<div class="container mt-4">

  <h2>User CRUD</h2>

  <form (ngSubmit)="isEditMode ? updateUser() : addUser()">

    <div class="mb-3">
      <label>Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.name"
        name="name"
        required
      />
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="user.email"
        name="email"
        required
      />
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="user.password"
        name="password"
      />
    </div>

    <div class="mb-3">
      <label>Role</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.role"
        name="role"
      />
    </div>

    <div class="form-check mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        [(ngModel)]="user.isActive"
        name="isActive"
      />

      <label class="form-check-label">
        Active
      </label>
    </div>

    <button
      type="submit"
      class="btn btn-primary me-2"
    >
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="resetForm()"
    >
      Reset
    </button>

  </form>

  <hr />

  <table class="table table-bordered mt-3">

    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th width="180">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of users">

        <td>{{ item.name }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.role }}</td>

        <td>
          {{ item.isActive ? 'Active' : 'Inactive' }}
        </td>

        <td>
          <button
            class="btn btn-warning btn-sm me-2"
            (click)="editUser(item)"
          >
            Edit
          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteUser(item.userId!)"
          >
            Delete
          </button>
        </td>

      </tr>
    </tbody>

  </table>

</div>
