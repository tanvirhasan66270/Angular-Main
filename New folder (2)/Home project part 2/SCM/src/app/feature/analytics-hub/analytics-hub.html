<div id="analytics-content" class="container-fluid px-4 py-4 animate-slide-up">
  <div class="d-flex align-items-center justify-content-between mb-5">
    <div>
      <h1 class="h2 fw-bold text-dark mb-1">Business Intelligence Hub</h1>
      <p class="text-muted mb-0">Advanced data analytics, forecasting, and performance metrics.</p>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-white border shadow-sm" (click)="openDateFilter()">
        <i class="bi" [ngClass]="selectedRange === 'Refreshing...' ? 'bi-arrow-repeat spin' : 'bi-calendar3'"></i>
        {{ selectedRange }}
      </button>
      <button class="btn btn-primary shadow-lg d-flex align-items-center gap-2" (click)="generateAnalyticsReport()" [disabled]="isGenerating">
        <span *ngIf="isGenerating" class="spinner-border spinner-border-sm" role="status"></span>
        <i *ngIf="!isGenerating" class="bi bi-file-earmark-pdf"></i>
        {{ isGenerating ? 'Generating PDF...' : 'Generate Report' }}
      </button>
    </div>
  </div>

  <!-- Row 1: Area Chart & Donut -->
  <div class="row g-4 mb-5">
    <div class="col-xl-8">
      <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <h5 class="fw-bold mb-0">Stock Level Trends</h5>
          <div class="text-success small fw-bold"><i class="bi bi-arrow-up"></i> 12.5% vs last week</div>
        </div>
        <div id="chart">
          <apx-chart
            [series]="chartOptions.series"
            [chart]="chartOptions.chart"
            [xaxis]="chartOptions.xaxis"
            [stroke]="chartOptions.stroke"
            [colors]="chartOptions.colors"
            [dataLabels]="chartOptions.dataLabels"
          ></apx-chart>
        </div>
      </div>
    </div>
    <div class="col-xl-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <h5 class="fw-bold mb-4">Inventory Distribution</h5>
        <div id="donut">
          <apx-chart
            [series]="donutOptions.series"
            [chart]="donutOptions.chart"
            [labels]="donutOptions.labels"
            [colors]="donutOptions.colors"
            [responsive]="donutOptions.donutOptions"
          ></apx-chart>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 2: Smaller KPI Cards -->
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-primary text-white">
        <div class="d-flex justify-content-between mb-3">
          <i class="bi bi-lightning-charge fs-3"></i>
          <span class="badge bg-white text-primary">High Velocity</span>
        </div>
        <div class="h3 fw-bold mb-1">84%</div>
        <div class="small opacity-75">Order Fulfillment Rate</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-success text-white">
        <div class="d-flex justify-content-between mb-3">
          <i class="bi bi-shield-check fs-3"></i>
          <span class="badge bg-white text-success">Compliant</span>
        </div>
        <div class="h3 fw-bold mb-1">99.2%</div>
        <div class="small opacity-75">Quality Control Pass Rate</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-info text-white">
        <div class="d-flex justify-content-between mb-3">
          <i class="bi bi-globe fs-3"></i>
          <span class="badge bg-white text-info">Global</span>
        </div>
        <div class="h3 fw-bold mb-1">12</div>
        <div class="small opacity-75">Active International Routes</div>
      </div>
    </div>
  </div>
</div>
