<div class="container-fluid mt-4 px-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold">Notifications</h4>
      <small class="text-muted">Manage system notifications</small>
    </div>

    <button class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#notificationModal"
            (click)="reset()">
      + Add Notification
    </button>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <div class="card-body p-0">

      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Title</th>
            <th>User</th>
            <th>Type</th>
            <th>Status</th>
            <th>Created</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let n of notifications">

            <td>{{ n.title }}</td>

            <td>{{ getUserName(n.recipientId) }}</td>

            <td>
              <span class="badge bg-info">{{ n.type }}</span>
            </td>

            <td>
              <span [class]="n.isRead ? 'badge bg-success' : 'badge bg-warning'">
                {{ n.isRead ? 'Read' : 'Unread' }}
              </span>
            </td>

            <td>{{ n.createdAt | date:'short' }}</td>

            <td class="text-end">

              <!-- MARK AS READ -->
              <button class="btn btn-sm btn-outline-success me-1"
                      (click)="markAsRead(n.id)">
                Mark Read
              </button>

              <!-- EDIT -->
              <button class="btn btn-sm btn-outline-primary me-1"
                      data-bs-toggle="modal"
                      data-bs-target="#notificationModal"
                      (click)="edit(n)">
                Edit
              </button>

              <!-- DELETE -->
              <button class="btn btn-sm btn-outline-danger"
                      (click)="delete(n.id)">
                Delete
              </button>

            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="notificationModal" tabindex="-1">

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content">

      <!-- HEADER -->
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">
          {{ isEditMode ? 'Update' : 'Create' }} Notification
        </h5>

        <button class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                (click)="reset()"></button>
      </div>

      <!-- BODY -->
      <div class="modal-body">

        <div class="row g-3">

          <!-- USER -->
          <div class="col-md-6">
            <label class="form-label">Recipient</label>
            <select class="form-select"
                    [(ngModel)]="notification.recipientId"
                    name="recipientId">

              <option value="">Select User</option>
              <option *ngFor="let u of users"
                      [value]="u.id">
                {{ u.name }}
              </option>

            </select>
          </div>

          <!-- TYPE -->
          <div class="col-md-6">
            <label class="form-label">Type</label>
            <select class="form-select"
                    [(ngModel)]="notification.type"
                    name="type">

              <option>INFO</option>
              <option>WARNING</option>
              <option>SUCCESS</option>
              <option>ERROR</option>

            </select>
          </div>

          <!-- TITLE -->
          <div class="col-12">
            <label class="form-label">Title</label>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="notification.title"
                   name="title">
          </div>

          <!-- MESSAGE -->
          <div class="col-12">
            <label class="form-label">Message</label>
            <textarea class="form-control"
                      rows="3"
                      [(ngModel)]="notification.message"
                      name="message"></textarea>
          </div>

        </div>

      </div>

      <!-- FOOTER -->
      <div class="modal-footer">

        <button class="btn btn-secondary"
                data-bs-dismiss="modal"
                (click)="reset()">
          Close
        </button>

        <button class="btn btn-primary"
                data-bs-dismiss="modal"
                (click)="isEditMode ? update() : add()">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>

      </div>

    </div>

  </div>

</div>
