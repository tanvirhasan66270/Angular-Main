<div class="container mt-4">

  <!-- ================= TITLE ================= -->
  <div class="mb-3">
    <h2 class="fw-bold text-primary">QC Checklist</h2>
  </div>

  <!-- ================= FORM CARD ================= -->
  <div class="card shadow mb-4">

    <div class="card-header bg-primary text-white">
      <strong>
        {{ isEditMode ? 'Update Checklist' : 'Add Checklist' }}
      </strong>
    </div>

    <div class="card-body">

      <form (ngSubmit)="isEditMode ? update() : add()">

        <div class="row g-3">

          <!-- INSPECTION -->
          <div class="col-md-4">
            <label class="form-label">Inspection</label>
            <select class="form-select"
              [(ngModel)]="checklist.inspectionId"
              name="inspectionId">

              <option value="">Select Inspection</option>

              <option *ngFor="let i of inspections" [value]="i.id">
                {{ i.inspectionType }}
              </option>

            </select>
          </div>

          <!-- CHECKPOINT NAME -->
          <div class="col-md-4">
            <label class="form-label">Checkpoint Name</label>
            <input type="text"
              class="form-control"
              [(ngModel)]="checklist.checkpointName"
              name="checkpointName">
          </div>

          <!-- IS PASSED -->
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select class="form-select"
              [(ngModel)]="checklist.isPassed"
              name="isPassed">

              <option [ngValue]="true">Passed</option>
              <option [ngValue]="false">Failed</option>

            </select>
          </div>

          <!-- REMARKS -->
          <div class="col-md-12">
            <label class="form-label">Remarks</label>
            <textarea class="form-control"
              rows="3"
              [(ngModel)]="checklist.remarks"
              name="remarks"></textarea>
          </div>

        </div>

        <!-- BUTTONS -->
        <div class="mt-3">

          <button type="submit" class="btn btn-success me-2">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>

          <button type="button"
            class="btn btn-secondary"
            (click)="reset()">
            Reset
          </button>

        </div>

      </form>

    </div>
  </div>

  <!-- ================= TABLE ================= -->
  <div class="card shadow">

    <div class="card-header bg-dark text-white">
      <strong>Checklist List</strong>
    </div>

    <div class="card-body table-responsive">

      <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Inspection</th>
            <th>Checkpoint</th>
            <th>Status</th>
            <th>Remarks</th>
            <th width="140">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let item of checklists; let i = index">

            <td>{{ i + 1 }}</td>

            <td>{{ getInspectionName(item.inspectionId) }}</td>

            <td>{{ item.checkpointName }}</td>

            <td>
              <span class="badge"
                [ngClass]="item.isPassed ? 'bg-success' : 'bg-danger'">
                {{ item.isPassed ? 'Passed' : 'Failed' }}
              </span>
            </td>

            <td>{{ item.remarks }}</td>

            <td>

              <button class="btn btn-sm btn-primary me-1"
                (click)="edit(item)">
                Edit
              </button>

              <button class="btn btn-sm btn-danger"
                (click)="delete(item.id)">
                Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>
  </div>

</div>
