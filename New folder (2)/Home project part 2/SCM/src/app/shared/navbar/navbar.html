<nav class="navbar navbar-expand-lg glass sticky-top py-3 border-bottom">
  <div class="container-fluid px-4">
    <!-- Mobile Toggle -->
    <button class="btn btn-light d-lg-none me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="bi bi-list fs-4"></i>
    </button>

    <!-- Global Search -->
    <div class="d-none d-md-flex align-items-center flex-grow-1 max-w-lg">
      <div class="input-group glass rounded-pill px-3 py-1">
        <span class="input-group-text bg-transparent border-0 text-muted">
          <i class="bi bi-search"></i>
        </span>
        <input type="text" class="form-control bg-transparent border-0 shadow-none small" placeholder="Search orders, products, or suppliers... (Ctrl + K)">
      </div>
    </div>

    <!-- Actions & Profile -->
    <div class="ms-auto d-flex align-items-center gap-3">
      <!-- Notification -->
      <button class="btn btn-light position-relative rounded-circle p-2" routerLink="/notification">
        <i class="bi bi-bell fs-5"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
          3+
        </span>
      </button>

      <!-- Settings -->
      <button class="btn btn-light rounded-circle p-2 d-none d-sm-flex" routerLink="/profile" title="Settings">
        <i class="bi bi-gear fs-5"></i>
      </button>

      <!-- User Dropdown -->
      <ng-container *ngIf="user; else authButtons">
        <div class="dropdown">
          <button class="btn btn-light d-flex align-items-center gap-2 rounded-pill px-2 py-1 border" type="button" data-bs-toggle="dropdown">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; font-size: 14px;">
              {{ user.name.charAt(0) }}
            </div>
            <span class="small fw-bold d-none d-sm-inline">{{ user.name }}</span>
            <i class="bi bi-chevron-down small text-muted"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end glass border-0 shadow-xl mt-3 animate-slide-up">
            <li class="px-3 py-2 border-bottom mb-2 d-sm-none">
              <div class="fw-bold">{{ user.name }}</div>
              <div class="text-muted small">{{ user.role }}</div>
            </li>
            <li><a class="dropdown-item rounded-2" routerLink="/profile"><i class="bi bi-person me-2"></i>My Profile</a></li>
            <li><a class="dropdown-item rounded-2" routerLink="/notification"><i class="bi bi-bell me-2"></i>Notifications</a></li>
            <li *ngIf="isAdminOrManager()"><a class="dropdown-item rounded-2" routerLink="/messages"><i class="bi bi-envelope me-2"></i>Messages</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger rounded-2" href="javascript:void(0)" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout Session</a></li>
          </ul>
        </div>
      </ng-container>
      
      <ng-template #authButtons>
        <div class="d-flex gap-2">
          <a routerLink="/login" class="btn btn-light rounded-pill px-4">Login</a>
          <a routerLink="/register" class="btn btn-primary rounded-pill px-4">Sign Up</a>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
